[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["python -m venv /opt/venv && /opt/venv/bin/pip install -r requirements.txt"]

[phases.build]
# Download the required NLTK tokenizers and corpuses
cmds = [
    "/opt/venv/bin/python -m nltk.downloader punkt", 
    "/opt/venv/bin/python -m nltk.downloader stopwords"
]

[start]
cmd = "/opt/venv/bin/python app.py"
